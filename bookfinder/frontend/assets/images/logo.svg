<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Book Gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glass/Lens Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background Container -->
  <rect width="500" height="500" rx="110" fill="url(#bgGrad)" />

  <!-- Logo Graphics Group -->
  <g filter="url(#dropShadow)" transform="translate(15, 0)">
    
    <!-- Open Book Base -->
    <path d="M 130 170 
             C 170 150, 210 160, 235 185 
             L 235 340 
             C 210 315, 170 305, 130 325 
             Z" 
          fill="url(#bookGrad)" opacity="0.9" />

    <path d="M 350 170 
             C 310 150, 270 160, 245 185 
             L 245 340 
             C 270 315, 310 305, 350 325 
             Z" 
          fill="url(#bookGrad)" />

    <!-- Center Spine Line -->
    <path d="M 240 185 L 240 340" stroke="#0f172a" stroke-width="4" stroke-linecap="round" opacity="0.4" />

    <!-- Magnifying Glass / Search Element -->
    <g transform="translate(45, 10)">
      <!-- Glass Outer Ring -->
      <circle cx="260" cy="200" r="65" fill="none" stroke="url(#glassGrad)" stroke-width="16" />
      
      <!-- Lens Inner Reflection -->
      <circle cx="260" cy="200" r="48" fill="#ffffff" fill-opacity="0.1" />
      
      <!-- Handle -->
      <path d="M 305 245 L 355 295" stroke="url(#glassGrad)" stroke-width="16" stroke-linecap="round" />
    </g>

  </g>

  <!-- Brand Typography -->
  <text x="250" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    BOOKFINDER
  </text>
</svg>
